name: Release

# Manual release: pick a version, and this builds the artifacts, rolls the
# CHANGELOG's [Unreleased] section into that version, tags it, and publishes a
# GitHub release with the built binaries and those changelog entries as the
# notes. Add entries under "## [Unreleased]" in CHANGELOG.md as you go.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.2.0 (no leading v)"
        required: true
        type: string

# Never run two releases at once (they both push to main + create a tag).
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # push the release commit/tag and create the GitHub release

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: windows
            os: windows-latest
            src: target/release/reaper_realackey.dll
            asset: reaper_realackey.dll
          - name: macos
            os: macos-latest
            # Built as a universal binary below; cargo prefixes the cdylib with
            # `lib`, REAPER wants reaper_*.dylib.
            asset: reaper_realackey.dylib
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install PHP (macOS SWELL resgen)
        if: matrix.name == 'macos'
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
      - name: Fetch WDL / SWELL (macOS)
        if: matrix.name == 'macos'
        run: git clone --depth 1 https://github.com/justinfrankel/WDL.git vendor/WDL

      - name: Build (Windows)
        if: matrix.name == 'windows'
        run: cargo build --release

      # Universal (arm64 + x86_64) so the extension loads whether REAPER runs as
      # native Apple Silicon, on an Intel Mac, or under Rosetta, and Developer-ID
      # signed + notarized so macOS loads it without the user clearing quarantine.
      # Without the signing secrets it falls back to an ad-hoc signature. Shared
      # with the macos-notarization-test workflow. See docs/macos-notarization.md.
      - name: Build, sign & notarize (macOS)
        if: matrix.name == 'macos'
        env:
          LIBCLANG_PATH: /Library/Developer/CommandLineTools/usr/lib
          ASSET: ${{ matrix.asset }}
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_NOTARY_KEY_P8_BASE64: ${{ secrets.MACOS_NOTARY_KEY_P8_BASE64 }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: bash .github/scripts/build-macos-universal.sh

      - name: Stage asset (Windows)
        if: matrix.name == 'windows'
        shell: bash
        run: |
          mkdir -p dist
          cp "${{ matrix.src }}" "dist/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Roll CHANGELOG [Unreleased] -> ${{ inputs.version }}
        run: |
          python3 .github/roll_changelog.py "${{ inputs.version }}" "$(date -u +%Y-%m-%d)" > release-notes.md

      - name: Set Cargo.toml version
        run: sed -i 's/^version = ".*"/version = "${{ inputs.version }}"/' Cargo.toml

      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # "with-models" bundles: the extension plus the local-alignment files
      # (model + ONNX Runtime library) laid out as they sit under REAPER's
      # resource path — for users on limited data plans where the in-app 300 MB
      # download is not an option. Every fetched file is verified against the
      # same SHA-256 digests the in-app downloader pins (src/align.rs).
      - name: Assemble with-models bundles
        run: |
          set -euo pipefail
          DMLORT_V="1.24.4"
          DML_V="1.15.4"
          MAC_ORT_V="1.28.0"
          MODEL_SHA="2eb5c3d2f6db2ef476aa7a7e1e5800145973e9064eb5292b1b9b8ada1207712a"
          WIN_DLL_SHA="e7eedec6a6f26dc39dc948276a75ef6d2bee3fff944d874ceed0bbd3b97bff40"
          DML_SHA="9c9e6d822561c6c41b90e6994b3e8857cf1d66dbfb1e0c4c799c7c89b4e92da1"
          MAC_DYLIB_SHA="dc19bbcb2f5c9fb3c68b4f9248aa0a35065ff702c5dbeae75eac54a74da97b6d"

          # Revision-pinned (main is mutable; the digest below pins these bytes).
          # Bundles carry the CPU lane (int8) - GPU users have working downloads
          # by definition and fetch the fp16 model in-app.
          curl -fsSL --retry 3 -o model.onnx \
            "https://huggingface.co/onnx-community/mms-300m-1130-forced-aligner-ONNX/resolve/2100fb247d8e43962eef24491597fbeb8b469531/onnx/model_int8.onnx"
          echo "${MODEL_SHA}  model.onnx" | sha256sum -c -
          # Windows runtime = the DirectML-enabled build (contains the CPU
          # execution provider too, so one runtime serves both lanes) plus the
          # DirectML redistributable it delay-loads from beside itself.
          curl -fsSL --retry 3 -o ortdml.nupkg \
            "https://www.nuget.org/api/v2/package/Microsoft.ML.OnnxRuntime.DirectML/${DMLORT_V}"
          unzip -q ortdml.nupkg "runtimes/win-x64/native/onnxruntime.dll"
          echo "${WIN_DLL_SHA}  runtimes/win-x64/native/onnxruntime.dll" | sha256sum -c -
          curl -fsSL --retry 3 -o directml.nupkg \
            "https://www.nuget.org/api/v2/package/Microsoft.AI.DirectML/${DML_V}"
          unzip -q directml.nupkg "bin/x64-win/DirectML.dll"
          echo "${DML_SHA}  bin/x64-win/DirectML.dll" | sha256sum -c -
          curl -fsSL --retry 3 -o mac.tgz \
            "https://github.com/microsoft/onnxruntime/releases/download/v${MAC_ORT_V}/onnxruntime-osx-arm64-${MAC_ORT_V}.tgz"
          tar -xzf mac.tgz "onnxruntime-osx-arm64-${MAC_ORT_V}/lib/libonnxruntime.${MAC_ORT_V}.dylib"
          echo "${MAC_DYLIB_SHA}  onnxruntime-osx-arm64-${MAC_ORT_V}/lib/libonnxruntime.${MAC_ORT_V}.dylib" | sha256sum -c -

          cat > THIRD-PARTY-LICENSES.txt <<'EOF'
          This bundle contains, alongside ReaLackey itself:

          * ReaLackey/models/mms300m-align-int8.onnx
            The MMS forced-alignment model (int8 ONNX conversion by
            onnx-community, from Meta AI's Massively Multilingual Speech
            project). License: CC-BY-NC 4.0 — attribution: MMS, Meta AI
            (https://huggingface.co/onnx-community/mms-300m-1130-forced-aligner-ONNX).
            Non-commercial use only.

          * ReaLackey/models/onnxruntime.dll / libonnxruntime.*.dylib
            ONNX Runtime, (c) Microsoft Corporation. MIT license
            (https://github.com/microsoft/onnxruntime).

          * ReaLackey/models/DirectML.dll (Windows only)
            DirectML, (c) Microsoft Corporation. MIT license
            (https://www.nuget.org/packages/Microsoft.AI.DirectML).
          EOF

          bundle_root() { # $1 = platform, $2 = extension file
            local root="realackey-with-models-$1"
            mkdir -p "$root/UserPlugins" "$root/ReaLackey/models"
            cp "dist/$2" "$root/UserPlugins/"
            cp model.onnx "$root/ReaLackey/models/mms300m-align-int8.onnx"
            cp THIRD-PARTY-LICENSES.txt "$root/"
            cp INSTALL.txt "$root/"
          }
          bundle_zip() { # $1 = platform
            (cd "realackey-with-models-$1" && zip -qr "../dist/realackey-${{ inputs.version }}-with-models-$1.zip" .)
          }

          cat > INSTALL.txt <<'EOF'
          ReaLackey with bundled alignment models
          =======================================

          Merge the two folders in this archive into your REAPER resource path
          (REAPER: Options > Show REAPER resource path in explorer/finder):

            UserPlugins/  -> the ReaLackey extension itself
            ReaLackey/    -> the local word-timing alignment files

          Then restart REAPER, open the provider settings, and enable
          "Refine word timings locally" on your transcription provider —
          with these files in place, nothing needs to be downloaded.

          macOS note: if the extension or alignment library is blocked as
          quarantined (downloaded archives are), clear the flag with:
            xattr -dr com.apple.quarantine <REAPER resource path>/UserPlugins <REAPER resource path>/ReaLackey
          EOF

          bundle_root windows reaper_realackey.dll
          cp runtimes/win-x64/native/onnxruntime.dll \
            realackey-with-models-windows/ReaLackey/models/onnxruntime.dll
          cp bin/x64-win/DirectML.dll \
            realackey-with-models-windows/ReaLackey/models/DirectML.dll
          bundle_zip windows
          bundle_root macos reaper_realackey.dylib
          cp "onnxruntime-osx-arm64-${MAC_ORT_V}/lib/libonnxruntime.${MAC_ORT_V}.dylib" \
            "realackey-with-models-macos/ReaLackey/models/libonnxruntime.${MAC_ORT_V}.dylib"
          bundle_zip macos

          # The in-app downloader fetches the runtimes from this repo's fixed
          # align-deps-1 release (src/align.rs). Fail the release loudly if
          # those assets are missing or drifted from the pinned digests - a
          # green release must not ship a dead in-app download path. Run the
          # align-deps.yml workflow once to (re)publish them.
          DEPS="https://github.com/${{ github.repository }}/releases/download/align-deps-1"
          curl -fsSL --retry 3 -o dep-win.dll "${DEPS}/onnxruntime-win-x64-dml-${DMLORT_V}.dll"
          echo "${WIN_DLL_SHA}  dep-win.dll" | sha256sum -c -
          curl -fsSL --retry 3 -o dep-dml.dll "${DEPS}/directml-${DML_V}.dll"
          echo "${DML_SHA}  dep-dml.dll" | sha256sum -c -
          curl -fsSL --retry 3 -o dep-mac.dylib "${DEPS}/libonnxruntime-osx-arm64-${MAC_ORT_V}.dylib"
          echo "${MAC_DYLIB_SHA}  dep-mac.dylib" | sha256sum -c -

      - name: Commit, tag, push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md Cargo.toml
          git commit -m "Release v${{ inputs.version }}"
          git tag "v${{ inputs.version }}"
          git push origin HEAD:main
          git push origin "v${{ inputs.version }}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A SemVer pre-release (any version with a "-", e.g. 0.4.0-beta.1) is
          # published as a GitHub prerelease so it never becomes "latest" — the
          # README's install link points at releases/latest, and testers opting
          # into a beta must not become every new user's default download.
          PRE=""
          case "${{ inputs.version }}" in
            *-*) PRE="--prerelease" ;;
          esac
          gh release create "v${{ inputs.version }}" \
            --title "ReaLackey v${{ inputs.version }}" \
            --notes-file release-notes.md \
            $PRE \
            dist/*
