name: Publish alignment runtime assets

# Repackages the ONNX Runtime binaries into FLAT files and attaches them to a
# fixed release (tag `align-deps-1`), which is where the extension's in-app
# downloader fetches the runtime libraries from (`src/align.rs::RUNTIME_FILES`
# — the official distributions are zip/tgz/NuGet archives, and shipping an
# unzipper for single files isn't worth it). Windows uses the DirectML-enabled
# build from NuGet (it contains the CPU execution provider too, so ONE runtime
# serves both the CPU and GPU lanes); macOS uses the official arm64 archive.
# Run once per version bump; the printed SHA-256 digests MUST match the pinned
# values in src/align.rs (the downloader rejects anything else).

on:
  workflow_dispatch:
    inputs:
      ort_dml_version:
        description: "Microsoft.ML.OnnxRuntime.DirectML NuGet version (Windows runtime; must match src/align.rs)"
        required: true
        default: "1.24.4"
        type: string
      directml_version:
        description: "Microsoft.AI.DirectML NuGet version (must match src/align.rs)"
        required: true
        default: "1.15.4"
        type: string
      ort_mac_version:
        description: "ONNX Runtime macOS release version (must match src/align.rs)"
        required: true
        default: "1.28.0"
        type: string

permissions:
  contents: write # create/update the align-deps release and its assets

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch and repackage the runtime binaries
        run: |
          set -euo pipefail
          DMLORT="${{ inputs.ort_dml_version }}"
          DML="${{ inputs.directml_version }}"
          MACV="${{ inputs.ort_mac_version }}"
          mkdir -p flat
          # Windows: the DirectML-enabled ONNX Runtime build (NuGet) + the
          # DirectML redistributable it delay-loads (found beside the runtime
          # at run time via the loader's altered search path).
          curl -fsSL --retry 3 -o ortdml.nupkg \
            "https://www.nuget.org/api/v2/package/Microsoft.ML.OnnxRuntime.DirectML/${DMLORT}"
          unzip -q ortdml.nupkg "runtimes/win-x64/native/onnxruntime.dll"
          cp runtimes/win-x64/native/onnxruntime.dll "flat/onnxruntime-win-x64-dml-${DMLORT}.dll"
          curl -fsSL --retry 3 -o directml.nupkg \
            "https://www.nuget.org/api/v2/package/Microsoft.AI.DirectML/${DML}"
          unzip -q directml.nupkg "bin/x64-win/DirectML.dll"
          cp bin/x64-win/DirectML.dll "flat/directml-${DML}.dll"
          # macOS arm64 (ONNX Runtime no longer ships Intel-mac builds):
          # lib/libonnxruntime.<V>.dylib out of the official tgz.
          curl -fsSL --retry 3 -o mac.tgz \
            "https://github.com/microsoft/onnxruntime/releases/download/v${MACV}/onnxruntime-osx-arm64-${MACV}.tgz"
          tar -xzf mac.tgz "onnxruntime-osx-arm64-${MACV}/lib/libonnxruntime.${MACV}.dylib"
          cp "onnxruntime-osx-arm64-${MACV}/lib/libonnxruntime.${MACV}.dylib" \
             "flat/libonnxruntime-osx-arm64-${MACV}.dylib"

      - name: Print digests (must match src/align.rs)
        run: |
          set -euo pipefail
          echo "Pin these in src/align.rs (RUNTIME_FILES sizes / sha256):"
          for f in flat/*; do
            echo "$f  $(stat -c %s "$f") bytes"
            sha256sum "$f"
          done

      - name: Create or update the align-deps release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="align-deps-1"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "Alignment runtime dependencies" \
              --notes "ONNX Runtime / DirectML libraries repackaged as flat files from the official Microsoft distributions (MIT license). Fetched by ReaLackey's in-app alignment-model download; not meant for manual installation — use the with-models release bundles instead." \
              --prerelease
          fi
          gh release upload "$TAG" flat/* --clobber
